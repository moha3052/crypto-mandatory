<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">Chatarkitektur med to klienter og en TCP-server</title>
<desc id="desc">Password aftales manuelt. Klienterne afleder samme nøgle. Serveren videresender ciphertext i begge retninger uden at kende passwordet.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="380" rx="20" fill="#f1f5f9"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#0f172a">
<text x="40" y="43" font-size="25" font-weight="700">To klienter · én central server</text>
<rect x="240" y="65" width="520" height="50" rx="12" fill="#e0e7ff"/>
<text x="500" y="96" text-anchor="middle" font-size="17">Samme password aftales manuelt uden for chatten</text>
<path d="M240 90H150V155 M760 90H850V155" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="35" y="160" width="240" height="135" rx="14" fill="#dbeafe" stroke="#2563eb"/>
<rect x="380" y="160" width="240" height="135" rx="14" fill="#fff" stroke="#64748b"/>
<rect x="725" y="160" width="240" height="135" rx="14" fill="#dbeafe" stroke="#2563eb"/>
<g text-anchor="middle"><text x="155" y="193" font-size="21" font-weight="700">Klient 1</text><text x="500" y="193" font-size="21" font-weight="700">TCP-server</text><text x="845" y="193" font-size="21" font-weight="700">Klient 2</text>
<g font-size="16"><text x="155" y="226">PBKDF2 → fælles nøgle</text><text x="155" y="254">XOR krypterer / dekrypterer</text><text x="500" y="226">127.0.0.1:5000</text><text x="500" y="254">Videresender ciphertext</text><text x="845" y="226">PBKDF2 → fælles nøgle</text><text x="845" y="254">XOR krypterer / dekrypterer</text></g>
<text x="327" y="204" font-size="13">Ciphertext</text><text x="672" y="204" font-size="13">Ciphertext</text></g>
<path d="M285 225H370 M630 225H715" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="500" y="341" text-anchor="middle" font-size="17" fill="#9a3412">Undervisningsdemo: gentaget XOR-nøgle er usikker. Serveren får ikke passwordet.</text>
</g></svg>
