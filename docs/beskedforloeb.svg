<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Fra tekst til ciphertext og tilbage</title><desc id="desc">UTF-8 encode, XOR med afledt nøgle, fire bytes længdefelt og ciphertext over TCP, XOR med samme nøgle og UTF-8 decode. Længden er ukrypteret.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="470" rx="20" fill="#f1f5f9"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#0f172a">
<text x="40" y="44" font-size="25" font-weight="700">Beskedens vej gennem programmet</text>
<text x="40" y="83" font-size="17">Lokalt hos hver klient: password + fælles salt → PBKDF2-HMAC-SHA256 → 32 bytes nøgle</text>
<g text-anchor="middle" font-size="17">
<rect x="40" y="110" width="240" height="70" rx="12" fill="#dbeafe"/><text x="160" y="139" font-weight="700">Tekst: “Anna: Hej”</text><text x="160" y="163">encode("utf-8") → bytes</text>
<rect x="380" y="110" width="240" height="70" rx="12" fill="#e0e7ff"/><text x="500" y="139" font-weight="700">encrypt_message()</text><text x="500" y="163">Bytes XOR nøgle</text>
<rect x="720" y="110" width="240" height="70" rx="12" fill="#ccfbf1"/><text x="840" y="139" font-weight="700">Ciphertext</text><text x="840" y="163">Sendes til serveren</text>
<path d="M285 145H370 M625 145H710" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="170" y="220" width="230" height="65" fill="#e2e8f0" stroke="#64748b"/><rect x="400" y="220" width="430" height="65" fill="#ccfbf1" stroke="#64748b"/>
<text x="285" y="246" font-weight="700">4 bytes længde</text><text x="285" y="272">Big-endian · ukrypteret</text><text x="615" y="246" font-weight="700">Ciphertext · 1–65536 bytes</text><text x="615" y="272">Serveren videresender samme indhold</text>
<path d="M840 185V205H615V215 M285 290V315H160V330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="335" width="240" height="65" rx="12" fill="#ccfbf1"/><text x="160" y="362" font-weight="700">Modtag hele beskeden</text><text x="160" y="386">Læs længden, så indholdet</text>
<rect x="380" y="335" width="240" height="65" rx="12" fill="#e0e7ff"/><text x="500" y="362" font-weight="700">decrypt_message()</text><text x="500" y="386">Ciphertext XOR samme nøgle</text>
<rect x="720" y="335" width="240" height="65" rx="12" fill="#dbeafe"/><text x="840" y="362" font-weight="700">decode("utf-8")</text><text x="840" y="386">Tekst: “Anna: Hej”</text>
<path d="M285 367H370 M625 367H710" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="500" y="442" font-size="16" fill="#9a3412">Illustration af protokollen — ikke en Wireshark-optagelse eller dokumentation for sikkerhed.</text>
</g></g></svg>
